<!DOCTYPE html>
<html>
<head>
<title>Jump Game</title>
<style>
body { margin:0; overflow:hidden; }
#player {
  width:50px;
  height:50px;
  background:red;
  position:absolute;
  bottom:0;
  left:50px;
}
</style>
</head>
<body>

<div id="player"></div>

<script>
let player = document.getElementById("player");
let jumping = false;

document.addEventListener("click", function(){
  if(!jumping){
    jumping = true;
    let jumpHeight = 0;
    let up = setInterval(() => {
      if(jumpHeight >= 150){
        clearInterval(up);
        let down = setInterval(() => {
          if(jumpHeight <= 0){
            clearInterval(down);
            jumping = false;
          }
          jumpHeight -= 5;
          player.style.bottom = jumpHeight + "px";
        }, 20);
      }
      jumpHeight += 5;
      player.style.bottom = jumpHeight + "px";
    }, 20);
  }
});
</script>

</body>
</html>
