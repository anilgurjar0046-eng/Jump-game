<!DOCTYPE html>
<html>
<head>
  <title>Advanced Road Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #444;
    }

    #game {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    #player {
      width: 40px;
      height: 40px;
      background: yellow;
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    .car {
      width: 60px;
      height: 40px;
      position: absolute;
      left: -100px;
      border-radius: 5px;
    }

    .lane1 { top: 200px; background: red; animation: move1 3s linear infinite; }
    .lane2 { top: 300px; background: blue; animation: move2 2s linear infinite; }
    .lane3 { top: 400px; background: green; animation: move3 1.5s linear infinite; }

    @keyframes move1 {
      from { left: -100px; }
      to { left: 100%; }
    }

    @keyframes move2 {
      from { left: -100px; }
      to { left: 100%; }
    }

    @keyframes move3 {
      from { left: -100px; }
      to { left: 100%; }
    }

    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 20px;
    }

    #level {
      position: absolute;
      top: 10px;
      right: 10px;
      color: white;
      font-size: 20px;
    }
  </style>
</head>

<body>

<div id="game">
  <div id="score">Score: 0</div>
  <div id="level">Level: 1</div>

  <div id="player"></div>

  <div class="car lane1"></div>
  <div class="car lane2"></div>
  <div class="car lane3"></div>
</div>

<script>
  let player = document.getElementById("player");
  let cars = document.querySelectorAll(".car");
  let score = 0;
  let level = 1;

  document.addEventListener("click", moveUp);

  function moveUp() {
    let currentBottom = parseInt(window.getComputedStyle(player).getPropertyValue("bottom"));
    player.style.bottom = currentBottom + 50 + "px";

    score++;
    document.getElementById("score").innerText = "Score: " + score;

    // Level increase
    if (score % 5 === 0) {
      level++;
      document.getElementById("level").innerText = "Level: " + level;

      cars.forEach(car => {
        let speed = Math.max(1, 3 - level * 0.3);
        car.style.animationDuration = speed + "s";
      });
    }
  }

  setInterval(() => {
    let playerRect = player.getBoundingClientRect();

    cars.forEach(car => {
      let carRect = car.getBoundingClientRect();

      if (
        playerRect.left < carRect.right &&
        playerRect.right > carRect.left &&
        playerRect.top < carRect.bottom &&
        playerRect.bottom > carRect.top
      ) {
        alert("Game Over 😢 Score: " + score);
        location.reload();
      }
    });

  }, 50);
</script>

</body>
</html>
