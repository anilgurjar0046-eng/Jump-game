<!DOCTYPE html>
<html>
<head>
  <title>Doll Jump Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(skyblue, green);
    }

    #game {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    #doll {
      width: 40px;
      height: 60px;
      background: pink;
      position: absolute;
      bottom: 50px;
      left: 50px;
      border-radius: 10px;
    }

    #ground {
      width: 100%;
      height: 50px;
      background: brown;
      position: absolute;
      bottom: 0;
    }

    .obstacle {
      width: 40px;
      height: 60px;
      background: black;
      position: absolute;
      bottom: 50px;
      right: -50px;
      animation: move 3s linear infinite;
    }

    @keyframes move {
      from { right: -50px; }
      to { right: 100%; }
    }
  </style>
</head>

<body>

<div id="game">
  <div id="doll"></div>
  <div id="ground"></div>
  <div class="obstacle"></div>
</div>

<script>
  let doll = document.getElementById("doll");
  let obstacle = document.querySelector(".obstacle");

  document.addEventListener("click", jump);

  function jump() {
    if (doll.style.bottom != "150px") {
      doll.style.bottom = "150px";
      setTimeout(() => {
        doll.style.bottom = "50px";
      }, 500);
    }
  }

  setInterval(() => {
    let dollBottom = parseInt(window.getComputedStyle(doll).getPropertyValue("bottom"));
    let obstacleRight = parseInt(window.getComputedStyle(obstacle).getPropertyValue("right"));

    if (obstacleRight > window.innerWidth - 120 && obstacleRight < window.innerWidth - 50 && dollBottom < 100) {
      alert("Game Over 😢");
      obstacle.style.animation = "none";
    }
  }, 10);
</script>

</body>
</html>
